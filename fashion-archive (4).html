<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Archive</title>
<style>
:root {
  --bg: #0e0e0f;
  --bg2: #161618;
  --bg3: #1e1e21;
  --border: #2a2a2e;
  --border2: #3a3a3f;
  --text: #f0efe8;
  --text2: #9e9d96;
  --text3: #5a5a56;
  --accent: #5bc8f5;
  --accent-bg: #0d1b3e;
  --accent-border: #1e3a6e;
  --tw: #5DCAA5;
  --tw-bg: #0a2218;
  --tw-border: #1D9E7540;
  --vogue: #AFA9EC;
  --vogue-bg: #16143a;
  --vogue-border: #534AB740;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-pill: 999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

/* 레이아웃 */
.app { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1.25rem; }
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
.header-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); }
.header-title span { color: var(--accent); }
.header-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

/* 스탯 */
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 1.5rem; }
.stat { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
.stat-num { font-size: 24px; font-weight: 600; line-height: 1; color: var(--text); }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* 범례 */
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }

/* 탭 */
.tabs { display: flex; gap: 2px; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
.tab { font-size: 13px; font-weight: 500; padding: 8px 16px; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* 툴바 */
.toolbar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.select-filter { font-size: 12px; padding: 6px 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg2); color: var(--text); cursor: pointer; }
.search-bar { font-size: 13px; padding: 7px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg2); color: var(--text); min-width: 180px; }
.search-bar::placeholder { color: var(--text3); }
.filter-count { font-size: 11px; color: var(--text3); }

/* 버튼 */
.btn { font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: transparent; color: var(--text); cursor: pointer; transition: all 0.15s; }
.btn:hover { background: var(--bg3); }
.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn-primary:hover { opacity: 0.85; }
.btn-sm { font-size: 11px; padding: 4px 10px; }
.btn-accent { background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent); border-radius: var(--radius-pill); }
.btn-accent:hover { border-color: var(--accent); color: #fff; }
.btn-tw-s { font-size: 10px; padding: 3px 8px; border-radius: var(--radius-pill); background: var(--tw-bg); border: 0.5px solid var(--tw-border); color: var(--tw); text-decoration: none; display: inline-flex; align-items: center; gap: 3px; transition: all 0.15s; }
.btn-tw-s:hover { background: #0f3028; }
.btn-vogue-s { font-size: 10px; padding: 3px 8px; border-radius: var(--radius-pill); background: var(--vogue-bg); border: 0.5px solid var(--vogue-border); color: var(--vogue); text-decoration: none; display: inline-flex; align-items: center; gap: 3px; transition: all 0.15s; }
.btn-vogue-s:hover { background: #201e4a; }

/* 테이블 */
.decade-group { margin-bottom: 2rem; }
.decade-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; padding: 6px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.decade-count { font-weight: 400; color: var(--text3); }
.table-view { width: 100%; border-collapse: collapse; }
.table-view th { font-size: 10px; font-weight: 600; color: var(--text3); text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.table-view td { padding: 8px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
.table-view tr { cursor: pointer; transition: background 0.1s; }
.table-view tr:hover td { background: var(--bg2); }
.brand-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 7px; flex-shrink: 0; }
.badge-edited { font-size: 9px; padding: 2px 6px; border-radius: var(--radius-pill); background: var(--tw-bg); color: var(--tw); border: 0.5px solid var(--tw-border); }
.badge-video { font-size: 9px; padding: 2px 6px; border-radius: var(--radius-pill); background: var(--accent-bg); color: var(--accent); border: 0.5px solid var(--accent-border); }
.badge-photo { font-size: 9px; padding: 2px 6px; border-radius: var(--radius-pill); background: var(--bg3); color: var(--text2); border: 0.5px solid var(--border); }
.link-cell { display: flex; gap: 5px; }

/* 그리드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; }
.card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
.card:hover { border-color: var(--border2); transform: translateY(-2px); }
.card-thumb { width: 100%; height: 140px; position: relative; overflow: hidden; }
.thumb-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 0.3s; }
.card:hover .thumb-bg { transform: scale(1.06); }
.thumb-overlay { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%); }
.thumb-initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; font-family: Georgia, serif; color: rgba(255,255,255,0.8); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.thumb-city-badge { position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: var(--radius-pill); font-size: 9px; font-weight: 600; backdrop-filter: blur(8px); }
.thumb-season-badge { position: absolute; bottom: 8px; left: 8px; font-size: 9px; font-weight: 500; padding: 3px 8px; border-radius: var(--radius-pill); background: rgba(0,0,0,0.65); color: #fff; }
.card-body { padding: 10px 12px; }
.card-brand { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.card-title { font-size: 12px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.card-ext { display: flex; gap: 4px; }
.card-ext a { font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-pill); text-decoration: none; transition: all 0.15s; }
.card-ext .tw { background: var(--tw-bg); color: var(--tw); border: 0.5px solid var(--tw-border); }
.card-ext .tw:hover { background: #0f3028; }
.card-ext .vg { background: var(--vogue-bg); color: var(--vogue); border: 0.5px solid var(--vogue-border); }
.card-ext .vg:hover { background: #201e4a; }

.empty { text-align: center; padding: 3rem; color: var(--text3); }

/* 상세 뷰 */
.detail-view { display: none; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 1.25rem; transition: color 0.15s; }
.back-btn:hover { color: var(--text); }
.detail-hero { border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.25rem; }
.detail-hero-thumb { width: 100%; height: 200px; position: relative; overflow: hidden; }
.detail-hero-thumb .thumb-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.detail-hero-thumb .thumb-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 60%); }
.detail-hero-thumb .thumb-initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 600; font-family: Georgia, serif; color: rgba(255,255,255,0.7); }
.detail-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px; }
.detail-info h2 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 6px; }
.detail-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.detail-body { padding: 14px 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; border-top: 0.5px solid var(--border); background: var(--bg2); }
.detail-note { font-size: 13px; color: var(--text2); line-height: 1.7; flex: 1; min-width: 180px; }
.detail-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ext-links { margin-bottom: 1.25rem; }
.ext-links-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
.ext-links-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ext-card { border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 16px; flex: 1; min-width: 170px; text-decoration: none; transition: all 0.15s; display: block; background: var(--bg2); }
.ext-card:hover { background: var(--bg3); border-color: var(--border2); }
.ext-card.tw { border-left: 2px solid var(--tw); }
.ext-card.vogue { border-left: 2px solid var(--vogue); }
.ext-card-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
.ext-card-desc { font-size: 11px; color: var(--text3); }

/* 룩 갤러리 */
.looks-section { margin-bottom: 1.5rem; }
.looks-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.looks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 8px; }
.look-card { position: relative; border-radius: var(--radius-sm); overflow: hidden; aspect-ratio: 3/4; background: var(--bg3); border: 0.5px solid var(--border); cursor: pointer; }
.look-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.look-card-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background 0.2s; }
.look-card:hover .look-card-overlay { background: rgba(0,0,0,0.35); }
.look-card-num { position: absolute; top: 5px; left: 5px; font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: var(--radius-pill); background: rgba(0,0,0,0.6); color: #fff; }
.look-card-remove { position: absolute; top: 5px; right: 5px; font-size: 10px; padding: 2px 6px; border-radius: var(--radius-pill); background: rgba(0,0,0,0.65); color: #fff; border: none; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
.look-card:hover .look-card-remove { opacity: 1; }
.look-add-zone { aspect-ratio: 3/4; border: 1.5px dashed var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; transition: all 0.15s; background: var(--bg3); position: relative; }
.look-add-zone:hover { border-color: var(--accent); background: var(--accent-bg); }
.look-add-zone:hover .add-icon, .look-add-zone:hover .add-label { color: var(--accent); }
.look-add-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.add-icon { font-size: 18px; color: var(--text3); transition: color 0.15s; }
.add-label { font-size: 10px; font-weight: 500; color: var(--text3); text-align: center; line-height: 1.4; transition: color 0.15s; }

/* 라이트박스 */
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 78vh; object-fit: contain; border-radius: var(--radius); }
.lightbox-meta { font-size: 12px; color: rgba(255,255,255,0.5); }
.lightbox-nav { display: flex; gap: 8px; }
.lightbox-nav button { font-size: 12px; font-weight: 500; padding: 6px 16px; border-radius: var(--radius-pill); border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; cursor: pointer; transition: background 0.15s; }
.lightbox-nav button:hover { background: rgba(255,255,255,0.1); }
.lightbox-close { position: fixed; top: 18px; right: 22px; font-size: 22px; color: rgba(255,255,255,0.6); background: none; border: none; cursor: pointer; }
.lightbox-close:hover { color: #fff; }

/* 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.modal { background: var(--bg2); border-radius: var(--radius); border: 0.5px solid var(--border); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 0.5px solid var(--border); }
.modal-header h2 { font-size: 14px; font-weight: 600; }
.modal-body { padding: 16px; }
.field { margin-bottom: 11px; }
.field label { display: block; font-size: 10px; font-weight: 600; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.field input, .field select, .field textarea { width: 100%; font-size: 13px; padding: 7px 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg3); color: var(--text); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent-border); }
.field textarea { height: 56px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; border-top: 0.5px solid var(--border); }
.tags-input { display: flex; gap: 4px; flex-wrap: wrap; padding: 5px 8px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); min-height: 34px; cursor: text; background: var(--bg3); }
.tag-pill { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--bg); color: var(--text2); display: flex; align-items: center; gap: 3px; }
.tag-pill button { background: none; border: none; cursor: pointer; font-size: 12px; line-height: 1; color: var(--text3); padding: 0; }
.tags-input input { border: none; outline: none; font-size: 12px; background: transparent; color: var(--text); flex: 1; min-width: 70px; }
.img-src-tabs { display: flex; gap: 5px; margin-bottom: 6px; }
.img-src-tab { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: var(--radius-pill); border: 0.5px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; }
.img-src-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.img-upload-zone { border: 1.5px dashed var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; cursor: pointer; transition: all 0.15s; background: var(--bg3); position: relative; }
.img-upload-zone:hover { border-color: var(--accent); background: var(--accent-bg); }
.img-upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.img-preview-wrap { margin-top: 6px; position: relative; }
.img-preview-wrap img { width: 100%; height: 80px; object-fit: cover; border-radius: var(--radius-sm); border: 0.5px solid var(--border); display: block; }
.img-preview-remove { position: absolute; top: 4px; right: 4px; font-size: 10px; padding: 2px 7px; border-radius: var(--radius-pill); background: rgba(0,0,0,0.7); color: #fff; border: none; cursor: pointer; }
.field-hint { font-size: 10px; color: var(--text3); margin-top: 3px; }
.preset-btn { font-size: 10px; padding: 3px 8px; border-radius: var(--radius-pill); background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent); cursor: pointer; font-weight: 500; transition: all 0.15s; }
.preset-btn:hover { border-color: var(--accent); color: #fff; }
.channel-link { font-size: 10px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent); }
.channel-link:hover { color: #fff; }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .tabs { overflow-x: auto; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
}

/* 태그 배지 & 메모 미리보기 */
.tag-badge { font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: var(--radius-pill); background: #16143a; color: var(--vogue); border: 0.5px solid var(--vogue-border); white-space: nowrap; }
.note-preview { font-size: 10px; color: var(--text3); line-height: 1.4; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

/* 디자이너 탭 */
.designer-index-bar { display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border); }
.designer-index-btn { font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill);background:var(--bg3);color:var(--text2);border:0.5px solid var(--border);text-decoration:none;transition:all 0.15s; }
.designer-index-btn:hover { border-color:var(--accent);color:var(--accent); }
.cd-sections { display:flex;flex-direction:column;gap:1.75rem; }
.cd-letter-section {}
.cd-letter-label { font-size:11px;font-weight:800;color:var(--accent);letter-spacing:2px;padding:4px 0 8px;border-bottom:1px solid var(--border2);margin-bottom:10px; }
.cd-card-list { display:flex;flex-direction:column;gap:6px; }
.cd-card { background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.15s; }
.cd-card-active { border-color:var(--accent); }
.cd-card-header { display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;transition:background 0.15s;gap:10px; }
.cd-card-header:hover { background:var(--bg3); }
.cd-name { font-size:14px;font-weight:600;color:var(--text); }
.cd-current-badge { font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);background:var(--tw-bg);color:var(--tw);border:0.5px solid var(--tw-border); }
.cd-chevron { font-size:11px;color:var(--text3);transition:transform 0.2s;flex-shrink:0; }
.cd-wiki-links { display:flex;gap:5px;align-items:center; }
.wiki-icon { font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--radius-pill);text-decoration:none;border:0.5px solid;transition:all 0.15s;white-space:nowrap; }
.wiki-ko { background:#1a1228;color:#a78bfa;border-color:#6d28d980; }
.wiki-ko:hover { background:#2d1b69;border-color:#a78bfa; }
.wiki-wp { background:#0e1e1a;color:#34d399;border-color:#05966940; }
.wiki-wp:hover { background:#064e3b;border-color:#34d399; }
.wiki-en { background:#0f172a;color:#60a5fa;border-color:#1d4ed840; }
.wiki-en:hover { background:#1e3a5f;border-color:#60a5fa; }
/* 타임라인 */
.cd-timeline { border-top:0.5px solid var(--border);padding:16px 16px 12px;background:var(--bg); }
.tl-wrap { overflow-x:auto; }
.tl-rows { display:flex;flex-direction:column;gap:8px;margin-top:8px; }
.tl-row { display:grid;grid-template-columns:160px 1fr 130px;align-items:center;gap:10px;min-height:28px; }
.tl-brand-cell { display:flex;align-items:center;gap:7px;min-width:0; }
.tl-brand-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
.tl-brand-name { font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.tl-bar-wrap { position:relative;height:22px;background:var(--bg3);border-radius:var(--radius-pill);overflow:hidden; }
.tl-bar { position:absolute;top:0;height:100%;border-radius:var(--radius-pill);background:var(--accent-bg);border:1px solid var(--accent-border);display:flex;align-items:center;padding:0 8px;transition:background 0.2s;min-width:3%; }
.tl-bar:hover { background:#122d5e; }
.tl-bar-current { background:linear-gradient(90deg,var(--accent-bg),#0d2e5a);border-color:var(--accent); }
.tl-bar-label { font-size:9px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }

function seasonToSlugs(s){const m=s.match(/(\d{4})\s*(FW|SS)/i);if(!m)return{tw:s.toLowerCase().replace(/\s/g,'-'),vogue:s.toLowerCase().replace(/\s/g,'-')};const yr=m[1],t=m[2].toUpperCase();if(t==='FW')return{tw:`fall-winter-${yr}`,vogue:`fall-${yr}`};return{tw:`spring-summer-${yr}`,vogue:`spring-${yr}`};}
function makeLinks(item){const fw=FW[item.fw]||FW.Other;const slugs=BRAND_SLUGS[item.brand];const sSlug=seasonToSlugs(item.season);if(!slugs||!fw.twCity)return null;return{tw:`https://www.tag-walk.com/en/collection/woman/${slugs.tw}/${sSlug.tw}?city=${fw.twCity}`,vogue:`https://www.vogue.com/fashion-shows/${sSlug.vogue}/${fw.vogueCity}/${slugs.vogue}`};}

function genSeasons(){const l=[];for(let y=2026;y>=1990;y--){l.push(`${y} FW`);l.push(`${y} SS`);}return[...new Set(l)];}

// 시즌 문자열을 숫자 순서값으로 변환 (비교용)
function seasonToNum(s){
  const m=s.match(/(\d{4})\s*(SS|FW)/i);
  if(!m)return 0;
  return parseInt(m[1])*10+(m[2].toUpperCase()==='SS'?1:2);
}

function getDesigner(brand, season){
  const list=CD_DB[brand];
  if(!list)return null;
  const sn=seasonToNum(season);
  for(const cd of list){
    const fromN=seasonToNum(cd.from);
    const toN=cd.to?seasonToNum(cd.to):999999;
    if(sn>=fromN&&sn<toN) return cd.designer;
  }
  return null;
}

function buildPreset(){
  const all=[];let id=1000;
  const brands=Object.keys(BRAND_SLUGS);
  ALL_SEASONS.forEach(season=>{
    brands.forEach(brand=>{
      const si=BRAND_SLUGS[brand];
      const tags=getTags(brand,season);
      const designer=getDesigner(brand,season)||'';
      all.push({id:id++,brand,fw:si.fw,season,type:'RTW',date:'',video:'',coverImg:null,looks:[],tags,note:'',designer,created:0,preset:true});
    });
  });
  return all;
}

let allPreset=[],userCustom=[],editId=null,currentTags=[],currentTab='table',detailId=null,lbIdx=0,currentCoverImg=null,currentImgTab='upload';

function load(){try{const s=JSON.parse(localStorage.getItem(SK));if(s){userCustom=s.custom||[];allPreset=s.preset||buildPreset();}else{allPreset=buildPreset();userCustom=[];}}catch(e){allPreset=buildPreset();userCustom=[];}}
function persist(){try{localStorage.setItem(SK,JSON.stringify({preset:allPreset,custom:userCustom}));}catch(e){try{localStorage.setItem(SK,JSON.stringify({preset:allPreset.map(d=>({...d,coverImg:null,looks:[]})),custom:userCustom.map(d=>({...d,coverImg:d.coverImg?.type==='url'?d.coverImg:null,looks:(d.looks||[]).filter(l=>l.type==='url')}))}));}catch(e2){}}}
function getMerged(){const cm=new Map(userCustom.map(c=>[`${c.brand}__${c.season}`,c]));return allPreset.map(p=>{const k=`${p.brand}__${p.season}`;return cm.has(k)?cm.get(k):p;}).concat(userCustom.filter(c=>c.id<1000));}
function getFiltered(){const q=(document.getElementById('search')?.value||'').toLowerCase();return getMerged().filter(d=>{if(q&&!`${d.brand}${d.season}${d.type}${(d.tags||[]).join('')}${d.note||''}`.toLowerCase().includes(q))return false;if(filterBrand!=='all'&&d.brand!==filterBrand)return false;if(filterSeason!=='all'&&d.season!==filterSeason)return false;if(filterFW!=='all'&&d.fw!==filterFW)return false;return true;});}
function saveCustom(item){const k=`${item.brand}__${item.season}`;const i=userCustom.findIndex(c=>`${c.brand}__${c.season}`===k);if(i>=0)userCustom[i]=item;else userCustom.push(item);persist();}

function fileToB64(file,cb){if(file.size>5*1024*1024){alert('5MB 이하만 가능해요.');return;}const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);}

function onBrandChange(){const brand=document.getElementById('f-brand').value.trim(),p=BP[brand];const hEl=document.getElementById('channel-hint'),pEl=document.getElementById('video-presets');if(!p){hEl.innerHTML='';pEl.innerHTML='';return;}const si=BRAND_SLUGS[brand];if(si)document.getElementById('f-fw').value=si.fw;hEl.innerHTML=`<a class="channel-link" href="${p.ch}" target="_blank">▶ YouTube 공식채널</a>`;pEl.innerHTML=p.vids.map(v=>`<button class="preset-btn" onclick="document.getElementById('f-video').value='${v.u}'">${v.l}</button>`).join('');}

function addTag(e){if(e.key==='Enter'||e.key===','){e.preventDefault();const v=e.target.value.trim().replace(/,/,'');if(v&&!currentTags.includes(v)){currentTags.push(v);renderTagPills();}e.target.value='';}}

function openDetail(id){detailId=id;const merged=getMerged();const item=merged.find(d=>d.id===id);if(!item)return;document.getElementById('list-view').style.display='none';document.getElementById('detail-view').style.display='block';const fw=FW[item.fw]||FW.Other;const coverSrc=item.coverImg?.value||'';const hasImg=!!coverSrc;const logoSvg=makeBrandSvg(item.brand);const bgStyle=coverSrc?`background-image:url('${coverSrc}');background-size:cover;background-position:center`:logoSvg?`background-image:url('${logoSvg}');background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#0a0a0a`:`background-image:url('${fw.thumb}');background-color:${fw.light}`;const initials=item.brand.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();const designer=item.designer||getDesigner(item.brand,item.season)||'';document.getElementById('detail-hero').innerHTML=`<div class="detail-hero-thumb"><div class="thumb-bg" style="${bgStyle}"></div><div class="thumb-overlay"></div><div class="thumb-initials" style="opacity:${(hasImg||logoSvg)?0:1}">${initials}</div><div class="detail-info"><h2>${item.brand} — ${item.season}</h2><div class="detail-meta"><span style="background:${fw.color}cc;color:#fff;font-size:10px;padding:3px 9px;border-radius:999px;font-weight:600">${fw.flag} ${fw.short}</span><span style="background:rgba(255,255,255,0.15);color:#fff;font-size:10px;padding:3px 9px;border-radius:999px">${item.type}</span>${designer?`<span style="background:rgba(255,255,255,0.18);color:#fff;font-size:10px;padding:3px 10px;border-radius:999px;font-style:italic">✦ ${designer}</span>`:''}${item.date?`<span style="background:rgba(255,255,255,0.1);color:#fff;font-size:10px;padding:3px 9px;border-radius:999px">${item.date}</span>`:''}</div></div></div><div class="detail-body"><div class="detail-note">${item.note||'<span style="color:var(--text3);font-size:12px">메모 없음 — 수정에서 추가</span>'}</div><div class="detail-actions">${item.video?`<a class="btn btn-accent" hr function toggleDesigner(name){
  window._activeDesigner = name;
  // 목록 숨기고 상세 뷰 표시
  document.getElementById('list-view').style.display='none';
  document.getElementById('designer-detail-view').style.display='block';
  renderDesignerDetail(name);
}

function closeDesignerDetail(){
  window._activeDesigner = null;
  document.getElementById('designer-detail-view').style.display='none';
  document.getElementById('list-view').style.display='block';
}

function renderDesignerDetail(name){
  // designerMap 재계산
  const designerMap={};
  Object.entries(CD_DB).forEach(([brand,list])=>{
    list.forEach(cd=>{
      cd.designer.split('&').map(n=>n.trim()).forEach(n=>{
        if(!designerMap[n])designerMap[n]=[];
        designerMap[n].push({brand,from:cd.from,to:cd.to,full:cd.designer});
      });
    });
  });
  const tenures=designerMap[name]||[];
  const current=tenures.filter(t=>!t.to);
  const sorted=[...tenures].sort((a,b)=>seasonToNum(b.from)-seasonToNum(a.from));

  const enc=encodeURIComponent(name);
  const wikiKey=name.replace(/ /g,'_');
  const wikiHtml=`
    <a class="wiki-icon wiki-ko" href="https://namu.wiki/w/${enc}" target="_blank">나무위키</a>
    <a class="wiki-icon wiki-wp" href="https://ko.wikipedia.org/wiki/${encodeURIComponent(wikiKey)}" target="_blank">위키백과</a>
    <a class="wiki-icon wiki-en" href="https://en.wikipedia.org/wiki/${wikiKey}" target="_blank">EN Wiki</a>`;

  const cards=sorted.map(t=>{
    const fromY=parseInt(t.from);
    const toY=t.to?parseInt(t.to):null;
    const fromS=t.from.includes('SS')?'SS':'FW';
    const toS=t.to?(t.to.includes('SS')?'SS':'FW'):null;
    const isCurrent=!t.to;
    const duration=toY?toY-fromY:2026-fromY;
    const fw=FW[BRAND_SLUGS[t.brand]?.fw||'Other']||FW.Other;
    const periodText=`${fromY} ${fromS} — ${toY?`${toY} ${toS}`:'현재'}`;
    return`<div class="tl-card${isCurrent?' tl-card-current':''}">
      <div class="tl-card-accent" style="background:${fw.color}"></div>
      <div class="tl-card-body">
        <div class="tl-card-brand">
          <span class="tl-brand-dot" style="background:${fw.color}"></span>
          <span class="tl-card-brand-name">${t.brand}</span>
          ${isCurrent?`<span class="tl-now-badge">현재</span>`:''}
          <span style="font-size:10px;color:var(--text3);margin-left:auto">${duration}년</span>
        </div>
        <div class="tl-card-period">${periodText}</div>
      </div>
    </div>`;
  }).join('');

  // 우선 골격 렌더 (사진 영역은 placeholder)
  document.getElementById('designer-detail-view').innerHTML=`
    <div class="app">
      <button class="back-btn" onclick="closeDesignerDetail()">← 디자이너별</button>
      <div class="cd-detail-hero">
        <div class="cd-detail-photo-wrap">
          <div class="cd-detail-photo" id="cd-photo-box">
            <div class="cd-photo-placeholder">
              <div style="font-size:28px;opacity:0.3">👤</div>
            </div>
          </div>
        </div>
        <div style="flex:1;min-width:0">
          <div class="cd-detail-name">${name}</div>
          ${current.length
            ?`<div class="cd-detail-current">현재 재임 · ${current.map(t=>t.brand).join(', ')}</div>`
            :`<div class="cd-detail-current" style="color:var(--text3)">전직</div>`}
          <div class="cd-wiki-links" style="margin-top:10px">${wikiHtml}</div>
        </div>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;margin-top:1.25rem">커리어 · ${sorted.length}개 하우스</div>
      <div class="tl-list">${cards}</div>
    </div>`;

  // Wikipedia API로 사진 비동기 로딩
  const apiUrl=`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiKey)}`;
  fetch(apiUrl)
    .then(r=>r.ok?r.json():null)
    .then(data=>{
      const box=document.getElementById('cd-photo-box');
      if(!box)return;
      const imgUrl=data?.thumbnail?.source||data?.originalimage?.source;
      if(imgUrl){
        box.innerHTML=`<img src="${imgUrl}" alt="${name}" class="cd-detail-img" onerror="this.parentElement.innerHTML='<div class=cd-photo-placeholder><div style=font-size:28px;opacity:0.3>👤</div></div>'">`;
      }
    })
    .catch(()=>{});
}

function renderTimeline(name, tenures){
  const sorted=[...tenures].sort((a,b)=>seasonToNum(b.from)-seasonToNum(a.from));
  const cards=sorted.map(t=>{
    const fromY=parseInt(t.from);
    const toY=t.to?parseInt(t.to):null;
    const fromS=t.from.includes('SS')?'SS':'FW';
    const toS=t.to?(t.to.includes('SS')?'SS':'FW'):null;
    const isCurrent=!t.to;
    const duration=toY?toY-fromY:2026-fromY;
    const fw=FW[BRAND_SLUGS[t.brand]?.fw||'Other']||FW.Other;
    const periodText=`${fromY} ${fromS} — ${toY?`${toY} ${toS}`:'현재'}`;
    const durationText=`${duration}년${isCurrent?' (재임 중)':''}`;
    return`<div class="tl-card${isCurrent?' tl-card-current':''}">
      <div class="tl-card-accent" style="background:${fw.color}"></div>
      <div class="tl-card-body">
        <div class="tl-card-brand">
          <span class="tl-brand-dot" style="background:${fw.color}"></span>
          <span class="tl-card-brand-name">${t.brand}</span>
          ${isCurrent?`<span class="tl-now-badge">현재</span>`:''}
        </div>
        <div class="tl-card-period">${periodText}</div>
        <div class="tl-card-duration">${durationText}</div>
      </div>
    </div>`;
  }).join('');
  return`<div class="tl-list">${cards}</div>`;
}

function toggleBrand(brand,cardEl){
  const card=cardEl.closest('.brand-card');
  const isOpen=card.classList.contains('open');
  card.classList.toggle('open');
  if(isOpen)return;
  // 시즌 리스트 렌더
  const safeId=brand.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'_');
  const listEl=document.getElementById('bsl-'+safeId);
  if(!listEl)return;
  const items=getMerged().filter(d=>d.brand===brand).sort((a,b)=>b.season.localeCompare(a.season));
  const rows=items.map(item=>{
    const links=makeLinks(item);
    const lc=(item.looks||[]).length;
    const tags=(item.tags||[]);
    const note=item.note||'';
    const designer=item.designer||getDesigner(item.brand,item.season)||'';
    return`<tr onclick="openDetail(${item.id})">
      <td>${item.season}${item.video?` <span class="badge-video" style="font-size:9px">▶</span>`:''}${lc?` <span class="badge-photo" style="font-size:9px">📷${lc}</span>`:''}</td>
      <td><span class="designer-name">${designer}</span></td>
      <td><div style="display:flex;gap:3px;flex-wrap:wrap">${tags.map(t=>`<span class="tag-badge">${t}</span>`).join('')}</div>${note?`<div class="note-preview">${note}</div>`:''}</td>
      <td onclick="event.stopPropagation()"><div class="link-cell">${links?`<a class="btn-tw-s" href="${links.tw}" target="_blank">TW</a><a class="btn-vogue-s" href="${links.vogue}" target="_blank">Vogue</a>`:''}</div></td>
    </tr>`;
  }).join('');
  listEl.innerHTML=`<table class="table-view"><thead><tr><th>시즌</th><th>디자이너</th><th>태그 · 메모</th><th>외부 링크</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function render(){
  const filtered=getFiltered();const merged=getMerged();
  const allB=[...new Set(merged.map(d=>d.brand))],allS=[...new Set(merged.map(d=>d.season))],allF=[...new Set(merged.map(d=>d.fw).filter(Boolean))];
  const customized=userCustom.filter(c=>c.video||c.note||c.coverImg||(c.looks&&c.looks.length)||(c.tags&&c.tags.length));
  document.getElementById('s-total').textContent=merged.length.toLocaleString();
  document.getElementById('s-brands').textContent=allB.length;
  document.getElementById('s-seasons').textContent=allS.length;
  document.getElementById('s-fw').textContent=allF.length;
  document.getElementById('header-sub').textContent=`${merged.length.toLocaleString()}개 컬렉션 · ${allB.length}개 브랜드 · 1990~현재 · ${customized.length}개 편집됨`;
  document.getElementById('color-legend').innerHTML=allF.map(k=>{const i=FW[k]||FW.Other;return`<span class="legend-item"><span class="legend-dot" style="background:${i.color}"></span>${i.flag} ${i.short}</span>`;}).join('');
  const tb=document.getElementById('toolbar');
  const brandSel=`<select class="select-filter" onchange="filterBrand=this.value;render()"><option value="all">모든 브랜드</option>${allB.map(b=>`<option value="${b}" ${filterBrand===b?'selected':''}>${b}</option>`).join('')}</select>`;
  const seasonSel=`<select class="select-filter" onchange="filterSeason=this.value;render()"><option value="all">모든 시즌</option>${ALL_SEASONS.map(s=>`<option value="${s}" ${filterSeason===s?'selected':''}>${s}</option>`).join('')}</select>`;
  const fwSel=`<select class="select-filter" onchange="filterFW=this.value;render()"><option value="all">모든 도시</option>${Object.entries(FW).filter(([k])=>allF.includes(k)).map(([k,v])=>`<option value="${k}" ${filterFW===k?'selected':''}>${v.flag} ${v.label}</option>`).join('')}</select>`;
  const countSpan=`<span class="filter-count">${filtered.length.toLocaleString()}개 표시</span>`;
  if(currentTab==='brand'){
    tb.innerHTML=brandSel+fwSel+countSpan;
  } else if(currentTab==='season'){
    tb.innerHTML=seasonSel+fwSel+countSpan;
  } else if(currentTab==='trend'){
    tb.innerHTML=`<span class="filter-count">태그를 클릭하면 해당 태그가 붙은 컬렉션을 볼 수 있어요</span>`;
  } else if(currentTab==='designer'){
    tb.innerHTML=`<span class="filter-count">디자이너 이름을 클릭하면 타임라인이 펼쳐져요</span>`;
  } else {
    tb.innerHTML=brandSel+seasonSel+fwSel+countSpan;
  }
  const ct=document.getElementById('main-content');
  if(currentTab==='table'){
    if(!filtered.length){ct.innerHTML=`<div class="empty">검색 결과 없음</div>`;return;}
    const byDecade={};filtered.forEach(d=>{const dec=Math.floor(parseInt(d.season)/10)*10;if(!byDecade[dec])byDecade[dec]=[];byDecade[dec].push(d);});
    ct.innerHTML=Object.entries(byDecade).sort((a,b)=>b[0]-a[0]).map(([dec,items])=>`<div class="decade-group"><div class="decade-label">${dec}s <span class="decade-count">${items.length}개</span></div><table class="table-view"><thead><tr><th>브랜드</th><th>시즌</th><th>디자이너</th><th>도시</th><th>태그 · 메모</th><th>외부 링크</th></tr></thead><tbody>${items.map(item=>{const fw=FW[item.fw]||FW.Other;const links=makeLinks(item);const lc=(item.looks||[]).length;const tags=(item.tags||[]);const note=item.note||'';const designer=item.designer||getDesigner(item.brand,item.season)||'';return`<tr onclick="openDetail(${item.id})"><td><span class="brand-dot" style="background:${fw.color}"></span>${item.brand}</td><td>${item.season}${item.video?` <span class="badge-video" style="font-size:9px">▶</span>`:''}${lc?` <span class="badge-photo" style="font-size:9px">📷${lc}</span>`:''}</td><td><span class="designer-name">${designer}</span></td><td>${fw.flag} ${fw.short}</td><td><div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:${note?3:0}px">${tags.map(t=>`<span class="tag-badge">${t}</span>`).join('')}</div>${note?`<div class="note-preview">${note}</div>`:''}</td><td onclick="event.stopPropagation()"><div class="link-cell">${links?`<a class="btn-tw-s" href="${links.tw}" target="_blank">TW</a><a class="btn-vogue-s" href="${links.vogue}" target="_blank">Vogue</a>`:''}</div></td></tr>`;}).join('')}</tbody></table></div>`).join('');
  } else if(currentTab==='brand'){
    // ── 브랜드별: 알파벳 색인 → 브랜드 카드 → 클릭 시 시즌 펼침
    const allBrands=[...new Set(getMerged().map(d=>d.brand))].sort((a,b)=>a.localeCompare(b));
    const byLetter={};
    allBrands.forEach(b=>{
      const letter=b[0].toUpperCase();
      if(!byLetter[letter])byLetter[letter]=[];
      byLetter[letter].push(b);
    });
    const letters=Object.keys(byLetter).sort();
    // 알파벳 색인 바
    const indexBar=`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border)">
      ${letters.map(l=>`<a href="#brand-letter-${l}" style="font-size:12px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);background:var(--bg3);color:var(--text2);border:0.5px solid var(--border);text-decoration:none;transition:all 0.15s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text2)'">${l}</a>`).join('')}
    </div>`;
    const sections=letters.map(letter=>{
      const brands=byLetter[letter];
      const brandCards=brands.map(brand=>{
        const fw=FW[BRAND_SLUGS[brand]?.fw||'Other']||FW.Other;
        const allItems=getMerged().filter(d=>d.brand===brand);
        const customCount=allItems.filter(d=>userCustom.some(c=>`${c.brand}__${c.season}`===`${d.brand}__${d.season}`&&(c.video||c.note||c.coverImg||(c.looks&&c.looks.length)))).length;
        return`<div class="brand-card" onclick="toggleBrand('${brand.replace(/'/g,"\\'")}',this)">
          <div class="brand-card-header">
            <div style="display:flex;align-items:center;gap:9px">
              <span class="brand-dot" style="background:${fw.color};width:9px;height:9px"></span>
              <span class="brand-card-name">${brand}</span>
              <span class="brand-card-city">${fw.flag} ${fw.short}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              ${customCount?`<span class="badge-edited">${customCount}개 편집</span>`:''}
              <span class="brand-card-count">${allItems.length}시즌</span>
              <span class="brand-chevron">›</span>
            </div>
          </div>
          <div class="brand-season-list" id="bsl-${brand.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'_')}"></div>
        </div>`;
      }).join('');
      return`<div id="brand-letter-${letter}" style="margin-bottom:1.75rem">
        <div style="font-size:11px;font-weight:800;color:var(--accent);letter-spacing:2px;padding:4px 0 8px;border-bottom:1px solid var(--border2);margin-bottom:10px">${letter}</div>
        <div style="display:flex;flex-direction:column;gap:6px">${brandCards}</div>
      </div>`;
    }).join('');
    ct.innerHTML=indexBar+sections;

  } else if(currentTab==='season'){
    // ── 시즌별: 연도 색인 → 연도별 섹션 → Womens / Mens / Couture 소분류
    const years=[...new Set(ALL_SEASONS.map(s=>parseInt(s)))].sort((a,b)=>b-a);
    const indexBar=`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border)">
      ${years.map(y=>`<a href="#season-year-${y}" style="font-size:12px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);background:var(--bg3);color:var(--text2);border:0.5px solid var(--border);text-decoration:none;transition:all 0.15s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text2)'">${y}</a>`).join('')}
    </div>`;
    const CAT_ORDER=['Womens','Mens','Couture'];
    const CAT_LABEL={'Womens':'Womens RTW','Mens':'Menswear','Couture':'Haute Couture'};
    const CAT_COLOR={'Womens':'#534AB7','Mens':'#378ADD','Couture':'#BA7517'};
    function itemToCategory(item){
      if(item.type==='Couture')return'Couture';
      if(item.type==='Menswear')return'Mens';
      return'Womens';
    }
    const sections=years.map(year=>{
      const yearSeasons=ALL_SEASONS.filter(s=>parseInt(s)===year);
      const yearItems=getMerged().filter(d=>parseInt(d.season)===year);
      if(!yearItems.length)return'';
      // FW/SS별 × 카테고리별 소분류
      const bySeasonType={};
      yearSeasons.forEach(s=>{ bySeasonType[s]={}; CAT_ORDER.forEach(c=>{bySeasonType[s][c]=[];}); });
      yearItems.forEach(d=>{
        const cat=itemToCategory(d);
        if(bySeasonType[d.season])bySeasonType[d.season][cat].push(d);
      });
      const seasonBlocks=yearSeasons.map(season=>{
        const label=season.includes('FW')?'Fall / Winter':'Spring / Summer';
        const hasAny=CAT_ORDER.some(c=>bySeasonType[season][c].length>0);
        if(!hasAny)return'';
        const catBlocks=CAT_ORDER.map(cat=>{
          const items=bySeasonType[season][cat];
          if(!items.length)return'';
          const rows=items.map(item=>{
            const fw=FW[item.fw]||FW.Other;
            const links=makeLinks(item);
            const lc=(item.looks||[]).length;
            const tags=(item.tags||[]);
            const note=item.note||'';
            const designer=item.designer||getDesigner(item.brand,item.season)||'';
            return`<tr onclick="openDetail(${item.id})">
              <td><span class="brand-dot" style="background:${fw.color}"></span>${item.brand}${item.video?` <span class="badge-video" style="font-size:9px">▶</span>`:''}${lc?` <span class="badge-photo" style="font-size:9px">📷${lc}</span>`:''}</td>
              <td><span class="designer-name">${designer}</span></td>
              <td>${fw.flag} ${fw.short}</td>
              <td><div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:${note?3:0}px">${tags.map(t=>`<span class="tag-badge">${t}</span>`).join('')}</div>${note?`<div class="note-preview">${note}</div>`:''}</td>
              <td onclick="event.stopPropagation()"><div class="link-cell">${links?`<a class="btn-tw-s" href="${links.tw}" target="_blank">TW</a><a class="btn-vogue-s" href="${links.vogue}" target="_blank">Vogue</a>`:''}</div></td>
            </tr>`;}).join('');
          return`<div style="margin-bottom:12px">
            <div style="font-size:10px;font-weight:700;color:${CAT_COLOR[cat]};letter-spacing:1px;text-transform:uppercase;padding:5px 0 6px;border-bottom:0.5px solid var(--border);margin-bottom:4px">${CAT_LABEL[cat]}</div>
            <table class="table-view"><thead><tr><th>브랜드</th><th>디자이너</th><th>도시</th><th>태그 · 메모</th><th>외부 링크</th></tr></thead><tbody>${rows}</tbody></table>
          </div>`;
        }).join('');
        return`<div style="margin-bottom:1.25rem">
          <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:8px">
            <span>${season}</span><span style="font-size:11px;color:var(--text3);font-weight:400">${label}</span>
          </div>
          ${catBlocks}
        </div>`;
      }).join('');
      return`<div id="season-year-${year}" style="margin-bottom:2rem">
        <div style="font-size:13px;font-weight:800;color:var(--accent);letter-spacing:1px;padding:6px 0 10px;border-bottom:2px solid var(--border2);margin-bottom:12px">${year}</div>
        ${seasonBlocks}
      </div>`;
    }).join('');
    ct.innerHTML=indexBar+sections;
  } else if(currentTab==='trend'){
    const merged=getMerged();
    const activeTag=window._activeTrendTag||null;
    const activeSeason=window._activeTrendSeason||'all';

    // ── 전체 태그맵 (클릭 시 컬렉션 목록용)
    const tagMap={};
    merged.forEach(d=>{
      (d.tags||[]).forEach(tag=>{
        if(!tagMap[tag])tagMap[tag]={count:0,items:[]};
        tagMap[tag].count++;
        tagMap[tag].items.push(d);
      });
    });

    // ── 시즌별 태그 빈도 집계
    const seasonTagMap={};  // { '2026 SS': { '#태그': count, ... }, ... }
    merged.forEach(d=>{
      if(!(d.tags||[]).length) return;
      if(!seasonTagMap[d.season]) seasonTagMap[d.season]={};
      d.tags.forEach(tag=>{
        seasonTagMap[d.season][tag]=(seasonTagMap[d.season][tag]||0)+1;
      });
    });

    // 시즌 목록 (태그 있는 시즌만, 최신순)
    const taggedSeasons=ALL_SEASONS.filter(s=>seasonTagMap[s]&&Object.keys(seasonTagMap[s]).length>0);

    // 시즌 필터 탭 HTML
    const seasonFilterHtml=`
      <div class="trend-season-filter">
        <button class="trend-season-btn${activeSeason==='all'?' active':''}" onclick="window._activeTrendSeason='all';window._activeTrendTag=null;render()">전체</button>
        ${taggedSeasons.map(s=>`<button class="trend-season-btn${activeSeason===s?' active':''}" onclick="window._activeTrendSeason='${s}';window._activeTrendTag=null;render()">${s}</button>`).join('')}
      </div>`;

    // 표시할 태그맵 결정
    let displayTagMap={};
    if(activeSeason==='all'){
      // 전체: 글로벌 태그맵 그대로
      Object.entries(tagMap).forEach(([t,v])=>{ displayTagMap[t]=v.count; });
    } else {
      // 특정 시즌
      displayTagMap=seasonTagMap[activeSeason]||{};
    }

    const sortedDisplay=Object.entries(displayTagMap).sort((a,b)=>b[1]-a[1]);
    const maxCount=sortedDisplay[0]?.[1]||1;
    const topTags=sortedDisplay.slice(0,10);
    const midTags=sortedDisplay.slice(10,40);
    const restTags=sortedDisplay.slice(40).sort((a,b)=>a[0].localeCompare(b[0],'ko'));

    function tagCloudHtml(entries){
      return entries.map(([tag,count])=>{
        const isActive=tag===activeTag;
        const size=Math.max(10,Math.round(10+(count/maxCount)*10));
        return`<button class="trend-tag-chip${isActive?' trend-tag-active':''}" style="font-size:${size}px" onclick="setTrendTag('${tag.replace(/'/g,"\\'")}')">${tag}<span class="trend-tag-count">${count}</span></button>`;
      }).join('');
    }

    // 선택된 태그의 컬렉션 목록 (시즌 필터 적용)
    let detailSection='';
    if(activeTag&&tagMap[activeTag]){
      const tagItems=tagMap[activeTag].items
        .filter(d=>activeSeason==='all'||d.season===activeSeason)
        .sort((a,b)=>b.season.localeCompare(a.season));
      const rows=tagItems.map(item=>{
        const fw=FW[item.fw]||FW.Other;
        const links=makeLinks(item);
        const lc=(item.looks||[]).length;
        const otherTags=(item.tags||[]).filter(t=>t!==activeTag);
        return`<tr onclick="openDetail(${item.id})">
          <td><span class="brand-dot" style="background:${fw.color}"></span>${item.brand}</td>
          <td>${item.season}</td>
          <td>${fw.flag} ${fw.short}</td>
          <td><div style="display:flex;gap:3px;flex-wrap:wrap">${otherTags.map(t=>`<span class="tag-badge">${t}</span>`).join('')}</div>${item.note?`<div class="note-preview">${item.note}</div>`:''}</td>
          <td onclick="event.stopPropagation()"><div class="link-cell">${links?`<a class="btn-tw-s" href="${links.tw}" target="_blank">TW</a><a class="btn-vogue-s" href="${links.vogue}" target="_blank">Vogue</a>`:''}</div></td>
        </tr>`;
      }).join('');
      detailSection=`<div class="trend-detail-section">
        <div class="trend-detail-header">
          <div style="display:flex;flex-direction:column;gap:6px;flex:1">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <span class="trend-detail-tag">${activeTag}</span>
              <span class="trend-detail-count">${tagItems.length}개 컬렉션${activeSeason!=='all'?` · ${activeSeason}`:''}</span>
            </div>
            ${getTagMeaning(activeTag)?`<div class="tag-meaning">${getTagMeaning(activeTag)}</div>`:''}
          </div>
          <button class="btn btn-sm" onclick="setTrendTag(null)" style="flex-shrink:0">✕ 닫기</button>
        </div>
        <table class="table-view">
          <thead><tr><th>브랜드</th><th>시즌</th><th>도시</th><th>다른 태그 · 메모</th><th>외부 링크</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    const restOpen=window._restTagsOpen||false;
    const seasonTitle=activeSeason==='all'?'전 시즌 통합':activeSeason;
    ct.innerHTML=`
      ${seasonFilterHtml}
      <div class="trend-cloud-wrap">
        <div class="trend-season-title">${seasonTitle} 트렌드태그</div>
        ${topTags.length?`<div class="trend-group-label">🔥 많이 쓰인 태그</div><div class="trend-cloud top-cloud">${tagCloudHtml(topTags)}</div>`:'<div style="color:var(--text3);font-size:13px;padding:2rem 0">해당 시즌의 태그 데이터가 없어요</div>'}
        ${midTags.length?`<div class="trend-group-label" style="margin-top:1.25rem">📌 주요 태그</div><div class="trend-cloud">${tagCloudHtml(midTags)}</div>`:''}
        ${restTags.length?`
          <div style="margin-top:1.25rem;display:flex;align-items:center;gap:10px">
            <span class="trend-group-label" style="margin:0">· 기타 태그</span>
            <button onclick="window._restTagsOpen=!window._restTagsOpen;render()" style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);border:0.5px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer">
              ${restOpen?'접기 ▲':`펼치기 ▼ (${restTags.length}개)`}
            </button>
          </div>
          ${restOpen?`<div class="trend-cloud" style="margin-top:10px">${tagCloudHtml(restTags)}</div>`:''}
        `:''}
      </div>
      ${detailSection}
    `;
  } else if(currentTab==='designer'){
    // ── 디자이너 탭: CD_DB 전체 디자이너 목록 → 알파벳순 색인 → 클릭 시 타임라인
    const activeDesigner=window._activeDesigner||null;

    // 전체 디자이너 목록 수집 (CD_DB에서)
    const designerMap={};
    Object.entries(CD_DB).forEach(([brand,list])=>{
      list.forEach(cd=>{
        const names=cd.designer.split('&').map(n=>n.trim());
        names.forEach(name=>{
          if(!designerMap[name])designerMap[name]=[];
          designerMap[name].push({brand,from:cd.from,to:cd.to,full:cd.designer});
        });
      });
    });

    const allDesigners=Object.keys(designerMap).sort((a,b)=>a.localeCompare(b,'en'));
    const byLetter={};
    allDesigners.forEach(name=>{
      const letter=name[0].toUpperCase();
      if(!byLetter[letter])byLetter[letter]=[];
      byLetter[letter].push(name);
    });
    const letters=Object.keys(byLetter).sort();

    // 알파벳 색인 바
    const indexBar=`<div class="designer-index-bar">
      ${letters.map(l=>`<a href="#dl-${l}" class="designer-index-btn">${l}</a>`).join('')}
    </div>`;

    // 위키 링크 생성
    function wikiLinks(name){
      const enc=encodeURIComponent(name);
      const ko=encodeURIComponent(name.split(' ').join('_'));
      return`<a class="wiki-icon wiki-ko" href="https://namu.wiki/w/${enc}" target="_blank" title="나무위키">나무위키</a><a class="wiki-icon wiki-wp" href="https://ko.wikipedia.org/wiki/${ko}" target="_blank" title="위키백과">위키백과</a><a class="wiki-icon wiki-en" href="https://en.wikipedia.org/wiki/${enc.replace(/%20/g,'_')}" target="_blank" title="Wikipedia (EN)">EN Wiki</a>`;
    }

    // 디자이너 카드 목록
    const sections=letters.map(letter=>{
      const designers=byLetter[letter];
      const cards=designers.map(name=>{
        const tenures=designerMap[name];
        const current=tenures.filter(t=>!t.to);
        const currentBadge=current.length?`<span class="cd-current-badge">${current.map(t=>t.brand).join(', ')}</span>`:'';
        const totalBrands=tenures.length;
        return`<div class="cd-card" onclick="toggleDesigner('${name.replace(/'/g,"\\'")}')">
          <div class="cd-card-header">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <span class="cd-name">${name}</span>
              ${currentBadge}
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:11px;color:var(--text3)">${totalBrands}개 하우스</span>
              <span style="font-size:13px;color:var(--text3)">›</span>
            </div>
          </div>
        </div>`;
      }).join('');
      return`<div id="dl-${letter}" class="cd-letter-section">
        <div class="cd-letter-label">${letter}</div>
        <div class="cd-card-list">${cards}</div>
      </div>`;
    }).join('');

    ct.innerHTML=indexBar+`<div class="cd-sections">${sections}</div>`;
  }
}
load();render();
</script>
</body>
</html>
